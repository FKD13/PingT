name: Release Publisher

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  publish_release:
    if: github.repository == 'fkd13/pingt'
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.3
      - name: Build
        run: go build -o pingt -ldflags="-s -w" .
      - name: Compress Build
        run: apt update && apt install -y upx && upx --best --lzma pingt
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        id: create_release
        with:
          draft: false
          prerelease: false
          release_name: ${{ github.ref }}
          tag_name: ${{ github.ref }}
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: pingt
          asset_name: pingt
          asset_content_type: application/octet-stream